org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# Mod
mod_id=ftbchunks
readable_name=FTB Chunks
# ultimateneo: full version becomes 26.3.0.1-ultimateneo (createModVersion prefixes the MC version)
