mod_author=FTB Team

# Maven
archives_base_name=ftb-chunks
maven_group=dev.ftb.mods

# MC
minecraft_version=26.3
supported_minecraft_versions=26.3
minecraft_version_range_maven=[26.3,27)

# Deps
moddev_version=2.0.148
neoforge_version=26.3.0.101
neoforge_version_range=[26.3.0.101,27)
neoforge_loader_version=4

# local builds (publishToMavenLocal from naouh/FTB-Library and naouh/FTB-Teams, ultimateneo/26.3)
ftb_library_version=26.3.0.1-ultimateneo
ftb_library_version_range_maven=[26.3.0.1,27)
ftb_teams_version=26.3.0.1-ultimateneo
ftb_teams_version_range_maven=[26.3.0.1,27)
# optional integration; no 26.3 build exists, so compile-only (API) and never loaded in dev
ftb_backups3_version=26.1.2.1
