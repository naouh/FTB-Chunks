plugins {
	id 'net.neoforged.moddev'
}

neoForge {
	version = project.neoforge_version
	// ultimateneo: fail the build if an AT entry no longer matches 26.3
	validateAccessTransformers = true

	runs {
		client {
			client()
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		// ultimateneo: headless test run (no EULA needed): gradlew :neoforge:runGameTestServer
		gameTestServer {
			type = "gameTestServer"
			systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
		}

		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			logLevel = org.slf4j.event.Level.DEBUG
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
			sourceSet(project(":common").sourceSets.main)
		}
	}
}

// ultimateneo: forward the console to the dev server so it can be stopped cleanly with "stop"
tasks.named('runServer', JavaExec).configure {
	standardInput = System.in
}

repositories {
	maven {
		url "https://maven.neoforged.net/releases/"
	}
}

dependencies {
	implementation("dev.ftb.mods:ftb-library-neoforge:${rootProject.ftb_library_version}")
	implementation("dev.ftb.mods:ftb-teams-neoforge:${rootProject.ftb_teams_version}")
	// ultimateneo: optional integration with no 26.3 build; compile-only, not on the dev runtime
	compileOnly("dev.ftb.mods:ftb-backups-3:${rootProject.ftb_backups3_version}")
}

jar {
	manifest {
		attributes([
				"Specification-Title"     : project.mod_id,
				"Specification-Vendor"    : project.mod_author,
				"Specification-Version"   : "1",
				"Implementation-Title"    : project.name,
				"Implementation-Version"  : version,
				"Implementation-Vendor"   : project.mod_author,
				"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}
